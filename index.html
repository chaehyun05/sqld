    tasks.push({kind:'quiz',label:'핵심 30문제 풀기 · 30분',sub:`${C}/${CORE.length}문항 풀었어 · 틀린 건 해설만 읽기`,done:C,total:CORE.length,act:()=>start(shuffle(Q.filter(q=>CORE.includes(q.id))))});
    R('u9',10,'시간 남으면: ROWNUM·계층형·정규식');
    tasks.push({kind:'card',label:'시험장 가는 길: 암기 카드',sub:`${known.size}/${CARDS.length}장`,done:known.size,total:CARDS.length,act:()=>go('cards')});
  }
  return tasks;
}
function dayPct(d){const t=dayTasks(d);let a=0;t.forEach(x=>a+=Math.min(1,x.done/x.total));return t.length?Math.round(a/t.length*100):0}
function renderHome(){
  const {left,day}=dayToday(); if(homeDay===null)homeDay=day;
  const done=Object.keys(hist).length, okc=Object.values(hist).filter(v=>v).length;
  const tasks=dayTasks(homeDay), pct=dayPct(homeDay);
  const fin=tasks.filter(t=>t.done>=t.total).length;
  const isToday=homeDay===day;
  view.innerHTML=`<div class="stack">
  <section class="panel">
    <div class="hero"><div class="big">${left>0?'D-'+left:'D-day'}</div><div><b>11월 14일(토) 제63회</b><p class="hint">30문제(60점) 맞히면 합격 · 1과목 4문제, 2과목 16문제 미만이면 과락</p></div></div>
  </section>
  <section class="panel stack">
    <div class="row" style="justify-content:space-between">
      <div><div class="label" style="margin:0">${isToday?'오늘 할 일':PLAN[homeDay][0]+'요일 할 일'}</div><h2 style="margin-top:2px">${PLAN[homeDay][1]}</h2></div>
      <div class="donut" style="--p:${pct}"><span>${pct}%</span></div>
    </div>
    <div class="chips">${[1,2,3,4].map(d=>`<button class="chip" id="hd-${d}" aria-pressed="${homeDay===d}" data-hd="${d}">${PLAN[d][0]}${d===day?' · 오늘':''}<span class="n">${dayPct(d)}%</span></button>`).join('')}</div>
    <div class="todo">${tasks.map((t,i)=>{const ok=t.done>=t.total,part=!ok&&t.done>0;
      return `<button class="task ${ok?'ok':''}" id="task-${i}" data-ti="${i}">
        <span class="box ${ok?'on':part?'half':''}"></span>
        <span class="tt"><b>${t.label}</b><span>${t.sub}</span>${t.total>1?`<span class="mini"><i style="width:${Math.min(100,t.done/t.total*100)}%"></i></span>`:''}</span>
        <span class="arr">${ok?'다시':t.kind==='read'?'읽기':t.kind==='card'?'카드':'풀기'}</span></button>`}).join('')}</div>
    <p class="hint">${fin}/${tasks.length}개 완료 · 단원은 개념 탭에서 "읽음"을 누르면 체크돼.</p>
  </section>
  <section class="panel"><div class="label">전체 진도</div>
    ${[1,2,3,4].map(d=>{const p=dayPct(d);return `<div class="prow"><span>${PLAN[d][0]} · ${PLAN[d][1].split(' (')[0].split(':')[0]}</span><span class="track"><i style="width:${p}%;background:${p>=100?'var(--ok)':'var(--accent)'}"></i></span><span class="pct">${p}%</span></div>`}).join('')}
  </section>
  <div class="quick">
    <button class="qa" id="q-10"><b>10문제 빠르게</b><span>안 푼 문제 위주</span></button>
    <button class="qa" id="q-cards"><b>암기 카드</b><span>${known.size}/${CARDS.length} 외움</span></button>
  </div>
  <section class="panel">
    <div class="stats"><div><b>${done}/${Q.length}</b><span>푼 문제</span></div><div><b>${done?Math.round(okc/done*100)+'%':'–'}</b><span>정답률</span></div><div><b>${readU.size}/${STUDY.length}</b><span>읽은 단원</span></div></div>
  </section>
  <section class="panel"><div class="label">파트별 정답률</div>${Object.keys(PARTS).map(k=>{const l=Q.filter(q=>q.p===k&&hist[q.id]!==undefined);const r=l.length?l.filter(q=>hist[q.id]).length/l.length:0;
    const col=!l.length?'var(--line)':r>=.7?'var(--ok)':r>=.4?'var(--hl)':'var(--bad)';
    return `<div class="prow"><span>${PARTS[k][1]}</span><span class="track"><i style="width:${l.length?r*100:0}%;background:${col}"></i></span><span class="pct">${l.length?Math.round(r*100)+'%':'–'}</span></div>`}).join('')}</section>
  <p class="hint">기록은 이 폰 브라우저에만 저장돼.</p>
  </div>`;
  view.querySelectorAll('[data-hd]').forEach(b=>b.onclick=()=>{homeDay=+b.dataset.hd;renderHome()});
  view.querySelectorAll('[data-ti]').forEach(b=>b.onclick=()=>tasks[+b.dataset.ti].act());
  document.getElementById('q-10').onclick=()=>{let l=shuffle(Q.filter(q=>hist[q.id]===undefined));if(l.length<10)l=l.concat(shuffle(Q.filter(q=>hist[q.id]!==undefined)));start(l.slice(0,10))};
  document.getElementById('q-cards').onclick=()=>go('cards');
}

// ---------- STUDY ----------
let openU=null;
function renderStudy(){
  view.innerHTML=`<div class="stack">
  <section class="panel"><h2>개념 공부</h2><p class="hint">처음부터 순서대로 읽고, 단원 끝에서 그 단원 문제를 바로 풀어봐. 다 읽으면 "읽음"을 눌러 둬.</p></section>
  ${[1,2].map(d=>`<div class="label" style="margin:6px 0 -4px">${PLAN[d][0]}요일 · ${PLAN[d][1]}</div>`+STUDY.filter(u=>u.day===d).map(u=>{
    const n=u.p?Q.filter(q=>q.p===u.p).length:0;
    return `<details class="unit" id="${u.id}" ${openU===u.id?'open':''}><summary><span><b>${readU.has(u.id)?'✓ ':''}${u.t}</b><span class="sub">${u.sub}</span></span></summary>
    <div class="ub">${u.h}${EXTRA[u.id]||''}
    <div class="row go">${u.p?`<button class="btn" data-part="${u.p}">이 단원 문제 ${n}개 풀기</button>`:''}
    <button class="btn ghost" data-read="${u.id}">${readU.has(u.id)?'읽음 취소':'읽음'}</button></div></div></details>`}).join('')).join('')}
  </div>`;
  view.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{readU.add(b.closest('details').id);saveAll();startPart(b.dataset.part)});
  view.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{const id=b.dataset.read;readU.has(id)?readU.delete(id):readU.add(id);saveAll();openU=id;renderStudy();document.getElementById(id).scrollIntoView({block:'start'})});
  view.querySelectorAll('details.unit').forEach(d=>d.addEventListener('toggle',()=>{if(d.open){openU=d.id;view.querySelectorAll('details.unit').forEach(o=>{if(o!==d)o.open=false});d.scrollIntoView({block:'start'})}}));
  if(openU){const el=document.getElementById(openU);if(el)el.scrollIntoView({block:'start'})}
}

// ---------- QUIZ ----------
function renderSetup(){
  const scopeBtn=(v,l,n)=>`<button class="chip" id="sc-${v}" aria-pressed="${setup.scope===v}" data-scope="${v}">${l}${n!==''?`<span class="n">${n}</span>`:''}</button>`;
  const partBtn=k=>`<button class="chip" id="pt-${k}" aria-pressed="${setup.parts.has(k)}" data-p="${k}">${PARTS[k][1]}<span class="n">${Q.filter(q=>q.p===k).length}</span></button>`;
  const cntBtn=v=>`<button class="chip" id="ct-${v}" aria-pressed="${setup.count===v}" data-count="${v}">${v==='all'?'전체':v+'문항'}</button>`;
  const n=pool().length,isMock=setup.scope==='mock';
  view.innerHTML=`<div class="stack"><section class="panel stack">
    <div><h2>문제 풀기</h2><p class="hint">보기를 누르면 바로 정답과 해설이 나와.</p></div>
    <div><div class="label">범위</div><div class="chips wrapc">
      ${scopeBtn('all','전체',Q.length)}${scopeBtn('new','안 푼 문제',Q.filter(q=>hist[q.id]===undefined).length)}${scopeBtn('s1','1과목',Q.filter(q=>q.s===1).length)}${scopeBtn('s2','2과목',Q.filter(q=>q.s===2).length)}${scopeBtn('mock','실전 모의',50)}${scopeBtn('parts','파트 선택','')}
    </div></div>
    ${setup.scope==='parts'?`<div><div class="label">파트</div><div class="chips wrapc">${Object.keys(PARTS).map(partBtn).join('')}</div></div>`:''}
    ${isMock?'<p class="hint">1과목 10 + 2과목 40문항을 뽑아 실제 배점으로 채점해. 실전처럼 90분 재고 풀어봐.</p>':`<div><div class="label">문항 수</div><div class="chips">${[10,20,30,'all'].map(cntBtn).join('')}</div></div>`}
    <button class="btn block" id="go" ${n?'':'disabled'}>${n}문항 시작</button>
  </section></div>`;
  view.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{setup.scope=b.dataset.scope;render()});
  view.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const k=b.dataset.p;setup.parts.has(k)?setup.parts.delete(k):setup.parts.add(k);render()});
  view.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{const v=b.dataset.count;setup.count=v==='all'?'all':+v;render()});
  document.getElementById('go').onclick=()=>start(pool(),setup.scope==='mock');
}
function renderQ(){
  const q=run.list[run.idx],picked=run.answers[q.id],done=picked!==undefined,total=run.list.length;
  const unit=STUDY.find(u=>u.p===q.p);
  view.innerHTML=`<section class="panel">
   <div class="qhead"><span class="tag">${PARTS[q.p][1]}</span><span style="font-family:var(--f-mono)">${run.idx+1}/${total}</span></div>
   <div class="bar"><i style="width:${(run.idx+1)/total*100}%"></i></div>
   <p class="qtext"><span class="num">#${q.id}</span>${q.q}</p>${q.x||''}
   <div class="choices">${q.c.map((c,i)=>{let cls='';if(done){if(i===q.a)cls='ok';else if(i===picked)cls='bad'}
     return `<button class="choice ${cls}" id="ch-${i}" data-i="${i}" ${done?'disabled':''}><span class="k">${K[i]}</span><span class="t">${esc(c)}</span></button>`}).join('')}</div>
   ${done?`<div class="exp"><div class="v ${picked===q.a?'ok':'bad'}">${picked===q.a?'정답!':'오답 · 정답은 '+K[q.a]}</div>${q.e}${detailHTML(q,picked)}
     ${picked!==q.a&&unit?`<div><button class="linkbtn" id="tounit">개념 다시 보기: ${unit.t}</button></div>`:''}</div>`:''}
  </section>
  <div class="qnav"><button class="btn ghost" id="prev" ${run.idx?'':'disabled'}>이전</button><button class="btn" id="next">${run.idx===total-1?'결과 보기':done?'다음':'건너뛰기'}</button></div>
  <div style="text-align:center"><button class="linkbtn" id="quit">그만 풀고 결과 보기</button></div>`;
  view.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  document.getElementById('prev').onclick=()=>{run.idx--;render()};
  document.getElementById('next').onclick=next;
  document.getElementById('quit').onclick=()=>{run.finished=true;render();window.scrollTo(0,0)};
  const tu=document.getElementById('tounit');if(tu)tu.onclick=()=>{openU=unit.id;go('study')};
}
function pick(i){const q=run.list[run.idx];if(run.answers[q.id]!==undefined)return;run.answers[q.id]=i;
  hist[q.id]=i===q.a?1:0; if(i===q.a)wrong.delete(q.id);else wrong.add(q.id);store.set('sqld_wrong_peak',Math.max(store.get('sqld_wrong_peak',0),wrong.size));saveAll();render()}
function next(){if(run.idx<run.list.length-1){run.idx++;render();window.scrollTo(0,0)}else{run.finished=true;render();window.scrollTo(0,0)}}
function renderResult(){
  const ans=run.list.filter(q=>run.answers[q.id]!==undefined);
  if(!ans.length){run=null;return renderSetup()}
  const ok=q=>run.answers[q.id]===q.a;
  const s1=ans.filter(q=>q.s===1),s2=ans.filter(q=>q.s===2);
  const r1=s1.length?s1.filter(ok).length/s1.length:null,r2=s2.length?s2.filter(ok).length/s2.length:null;
  const sc1=r1===null?null:Math.round(r1*20),sc2=r2===null?null:Math.round(r2*80);
  const tot=(sc1??0)+(sc2??0),both=r1!==null&&r2!==null,pass=both&&tot>=60&&r1>=.4&&r2>=.4;
  const wl=ans.filter(q=>!ok(q));
  if(run.mock&&ans.length===run.list.length)store.set('sqld_mock',{score:tot,ok:ans.filter(ok).length});
  view.innerHTML=`<div class="stack"><section class="panel stack">
    <div class="row" style="justify-content:space-between"><h2>결과</h2>
    ${both?`<span class="pass ${pass?'y':'n'}">${pass?'합격권':(r1<.4||r2<.4?'과락 위험':'60점 미만')}</span>`:''}</div>
    <div class="score">
      <div class="s"><b>${ans.filter(ok).length}/${ans.length}</b><span>맞힌 문항</span></div>
      <div class="s"><b>${both?tot:'–'}</b><span>예상 점수 / 100</span></div>
      <div class="s"><b>${sc1??'–'}</b><span>1과목 / 20</span></div>
      <div class="s"><b>${sc2??'–'}</b><span>2과목 / 80</span></div>
    </div>
    ${both?'':'<p class="hint">두 과목을 다 풀면 실제 배점으로 합격 여부를 판정해.</p>'}
  </section>
  <section class="panel"><div class="label">틀린 문제 ${wl.length}</div>
    ${wl.length?wl.map(q=>`<div class="witem"><span class="id">#${q.id}</span><span class="tx">${q.q}</span></div>`).join(''):'<p class="empty">전부 맞혔어!</p>'}</section>
  <div class="stack">${wl.length?'<button class="btn block" id="retry">틀린 문제 다시 풀기</button>':''}
    <button class="btn ghost block" id="review">문제 다시 보기</button><button class="btn ghost block" id="home">새로 풀기</button></div></div>`;
  const r=document.getElementById('retry');if(r)r.onclick=()=>start(shuffle(wl));
  document.getElementById('review').onclick=()=>{run.finished=false;run.idx=0;render()};
  document.getElementById('home').onclick=()=>{run=null;render()};
}

// ---------- CARDS ----------
const CARDS=[];CHEAT.forEach(([sec,rows])=>rows.forEach(([f,b])=>CARDS.push({id:sec+'|'+f,sec,f,b})));
let cardSec='all',deck=null,ci=0,flipped=false;
function buildDeck(){deck=shuffle(CARDS.filter(c=>(cardSec==='all'||c.sec===cardSec)&&!known.has(c.id)));ci=0;flipped=false}
function renderCards(){
  if(!deck)buildDeck();
  const secs=['all',...CHEAT.map(c=>c[0])];
  const head=`<section class="panel stack"><div><h2>암기 카드</h2><p class="hint">카드를 눌러 뒤집고, 외웠으면 "알아", 아니면 "몰라". 모르는 카드는 뒤로 다시 와.</p></div>
    <div class="chips">${secs.map(s=>`<button class="chip" aria-pressed="${cardSec===s}" data-sec="${s}">${s==='all'?'전체':s}</button>`).join('')}</div></section>`;
  if(!deck.length){
    const tot=CARDS.filter(c=>cardSec==='all'||c.sec===cardSec).length;
    view.innerHTML=`<div class="stack">${head}<section class="panel empty">이 묶음 ${tot}장을 다 외웠어!<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="reset">처음부터 다시</button></div></section></div>`;
  } else {
    const c=deck[ci%deck.length];
    view.innerHTML=`<div class="stack">${head}
    <div class="cnt">남은 카드 ${deck.length}장 · 외운 카드 ${known.size}/${CARDS.length}</div>
    <div class="fc ${flipped?'flip':''}" id="card" role="button" tabindex="0" aria-label="카드 뒤집기"><div class="in">
      <div class="face front"><span class="sec">${c.sec}</span><div class="w">${c.f}</div><span class="tap">눌러서 답 보기</span></div>
      <div class="face back"><span class="sec">${c.f}</span><div class="w">${c.b}</div></div>
    </div></div>
    <div class="fcbtns"><button class="btn no" id="no">몰라</button><button class="btn yes" id="yes">알아</button></div></div>`;
    const card=document.getElementById('card');
    card.onclick=()=>{flipped=!flipped;card.classList.toggle('flip',flipped)};
    card.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();card.onclick()}};
    document.getElementById('yes').onclick=()=>{known.add(c.id);saveAll();deck.splice(ci%deck.length,1);flipped=false;renderCards()};
    document.getElementById('no').onclick=()=>{const x=deck.splice(ci%deck.length,1)[0];deck.push(x);flipped=false;renderCards()};
  }
  view.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{cardSec=b.dataset.sec;buildDeck();renderCards()});
  const rs=document.getElementById('reset');if(rs)rs.onclick=()=>{CARDS.filter(c=>cardSec==='all'||c.sec===cardSec).forEach(c=>known.delete(c.id));saveAll();buildDeck();renderCards()};
}

// ---------- WRONG ----------
function renderWrong(){
  const l=Q.filter(q=>wrong.has(q.id));
  if(!l.length){view.innerHTML='<section class="panel empty">틀린 문제가 여기에 자동으로 모여. 다시 풀어서 맞히면 빠져.</section>';return}
  view.innerHTML=`<div class="stack"><button class="btn block" id="wgo">오답 ${l.length}문항 다시 풀기</button>
  ${l.map(q=>`<section class="panel"><span class="tag">${PARTS[q.p][1]}</span>
    <p class="qtext" style="margin-top:8px"><span class="num">#${q.id}</span>${q.q}</p>${q.x||''}
    <div class="exp"><div class="v ok">정답 ${K[q.a]} ${esc(q.c[q.a])}</div>${q.e}${detailHTML(q,-1)}</div></section>`).join('')}
  <button class="btn ghost block" id="wclr">오답 노트 비우기</button></div>`;
  document.getElementById('wgo').onclick=()=>start(shuffle(l));
  const c=document.getElementById('wclr');c.onclick=()=>{if(c.dataset.sure){wrong.clear();saveAll();render()}else{c.dataset.sure=1;c.textContent='한 번 더 누르면 비워져'}};
}

function render(){
  document.querySelectorAll('.tabbar button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  if(tab==='home')return renderHome();
  if(tab==='study')return renderStudy();
  if(tab==='cards')return renderCards();
  if(tab==='wrong')return renderWrong();
  if(!run)return renderSetup();
  if(run.finished)return renderResult();
  renderQ();
}
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='quiz'&&tab==='quiz'&&run&&run.finished)run=null;go(b.dataset.tab)});
document.addEventListener('keydown',e=>{
  if(tab!=='quiz'||!run||run.finished)return;
  if(['1','2','3','4'].includes(e.key))pick(+e.key-1);
  else if(e.key==='Enter'){e.preventDefault();next()}
});
saveAll();render();

</script>
